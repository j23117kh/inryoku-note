<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>引力ノート Gemma 4 利用者評価</title>
<style>
:root{font-family:system-ui,-apple-system,'Yu Gothic',sans-serif;color:#202833;background:#f5f7fa}*{box-sizing:border-box}
body{margin:0}header{padding:18px max(20px,calc((100vw - 1160px)/2));background:#fff;border-bottom:1px solid #d9e0e8}
h1{font-size:22px;margin:0 0 5px}.muted{color:#627086;font-size:13px}main{max-width:1160px;margin:20px auto;padding:0 14px;display:grid;grid-template-columns:320px 1fr;gap:18px}
section,.panel{background:#fff;border:1px solid #d9e0e8;border-radius:10px;padding:16px;margin-bottom:14px}h2{font-size:16px;margin:0 0 12px}p{line-height:1.7}
label{font-size:13px;display:block;margin:10px 0 5px;font-weight:600}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:9px;border:1px solid #abb9ca;border-radius:6px;background:#fff}button{background:#243b5b;color:#fff;border:0;border-radius:6px;padding:9px 12px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#e9edf4;color:#27374d}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}small{color:#64748b}.hit{padding:14px 4px;border-bottom:1px solid #e2e7ee}.hit h3{font-size:16px;margin:0 0 5px}.hit p{white-space:pre-wrap;line-height:1.5;margin:8px 0}.meta{font-size:12px;color:#607287}.link{border-left:3px solid #7989a2;margin:10px 0;padding:8px 10px;background:#f5f7fb}.warning{font-size:12px;color:#5f4830;background:#fff7ea;padding:8px;border-radius:5px}.hidden{display:none!important}#state{font-size:12px;margin:8px 0}.pill{font-size:12px;background:#e9f0f7;padding:4px 8px;border-radius:30px}@media(max-width:800px){main{display:block}header{padding:15px}}
</style></head>
<body><header><h1>引力ノート 利用者評価</h1><div class="muted">研究用・読み取り専用 / 条件 <b id="condHead"></b> / 25件の固定メモ / 検索順位は両条件で同一方式</div></header>
<main><aside>
<section><h2>参加者と課題</h2><p class="warning">研究の説明・同意を受けた後に開始してください。個人名は入力しないでください。参加は任意です。</p>
<label for="pid">匿名参加者ID（例：P001）</label><input id="pid" placeholder="P001" maxlength="24">
<label for="order">実施順序</label><select id="order"><option value="AB">AB（前半A、後半B）</option><option value="BA">BA（前半B、後半A）</option></select>
<label for="task">課題</label><select id="task"></select><p id="question"></p>
<div class="row"><button id="start">課題を開始</button><button id="finish" class="secondary" disabled>課題を記録</button></div><div id="state" aria-live="polite">未開始</div>
</section>
<section><h2>回答・評価</h2><label>選択したメモ</label><div id="picked" class="muted">未選択（検索結果から選択）</div>
<label for="relevance">検索したメモの適切さ（1～5）</label><select id="relevance"><option value="">未回答</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
<label for="clarity">情報の探しやすさ（1～5）</label><select id="clarity"><option value="">未回答</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
<label for="relationRating" id="relationLabel">AIの関係説明の役立ち度（1～5）</label><select id="relationRating"><option value="">未回答</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
<label for="comment">コメント（任意）</label><textarea id="comment" rows="3"></textarea>
<button id="export" class="secondary" style="width:100%;margin-top:12px">記録をCSVで保存</button><div id="counter" class="muted"></div>
</section></aside>
<div><section><h2>質問文から検索</h2><label for="query">検索キーワード・質問文</label><textarea id="query" rows="2" placeholder="課題を開始してから検索してください"></textarea><div class="row" style="margin-top:10px"><button id="search" disabled>検索する</button><span id="busy" class="muted" aria-live="polite"></span></div></section>
<section><h2>検索結果（上位10件・閾値30%）</h2><div id="results" class="muted">課題開始後、検索してください。</div></section>
<section id="aiPanel"><h2>Gemma 4の推定関係</h2><p class="warning">AIの予測であり、利用者に承認された関係ではありません。「関係なし」は線として表示されません。判定対象は事前に選んだ21組のみです。</p><div id="aiLinks" class="muted">検索結果のメモに関する関係候補を表示します。</div></section></div></main>
<script>const DATA={"condition":"A","meta":{"corpus_sha256":"fcaaad114fb7476733113eccb493f2e513ed392b8bb28c93f49e295114e1d01c","checkpoint_sha256":"3e82b10f6bf7fa0cdf584d82b96bd613f40bcfff5793efd34d57378b609294e0","model":"gemma-4-26b-a4b-it","tasks":[{"id":"T01","question":"メモを探すアプリの最初の構想を探してください。"},{"id":"T02","question":"メモ検索で、キーワードと文章の意味を組み合わせる案を探してください。"},{"id":"T03","question":"学習時間を記録する方法を具体化したメモを探してください。"},{"id":"T04","question":"苦手な問題を優先して出す仕組みに関するメモを探してください。"},{"id":"T05","question":"検索結果に説明をつける案を探してください。"},{"id":"T06","question":"学習記録を週単位で見られるようにする案を探してください。"},{"id":"T07","question":"ゼミ発表で結果の見せ方を表に変えるメモを探してください。"},{"id":"T08","question":"Pythonの作業でJupyter Notebookを使うことに関するメモを探してください。"}],"source_pairs":21,"shown_links":17,"scoring_endpoint":"/api/integrated-search","search_top_k":10,"search_threshold_percent":30},"links":[]};</script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), cond=DATA.condition, tasks=DATA.meta.tasks;
const label={development:'発展',branch:'分岐',revision:'修正・置換',related:'関連'};
let startMs=null,selected=null,lastQuery='',lastHits=[],rows=[],searches=0;
$('condHead').textContent=cond==='A'?'A：AI関係表示なし':'B：AI推定関係を表示';
if(cond==='A'){$('aiPanel').classList.add('hidden');$('relationLabel').classList.add('hidden');$('relationRating').classList.add('hidden');}
const allowed=(t,order)=>order==='AB'?(cond==='A'?t<4:t>=4):(cond==='B'?t<4:t>=4);
function tasksUpdate(){let old=$('task').value;const opts=tasks.map((x,i)=>allowed(i,$('order').value)?x:null).filter(Boolean);$('task').replaceChildren();for(let t of opts){let o=new Option(t.id,t.id);$('task').add(o)}if(opts.some(x=>x.id===old))$('task').value=old;questionUpdate()}
function questionUpdate(){let t=tasks.find(x=>x.id===$('task').value);$('question').textContent=t?t.question:'';}
function setStatus(s){$('state').textContent=s}function begin(){if(startMs!==null){alert('先に現在の課題を記録してください');return}if(!/^[A-Za-z0-9_-]{2,24}$/.test($('pid').value.trim())){alert('匿名参加者IDを入力してください');return}startMs=performance.now();selected=null;searches=0;lastHits=[];lastQuery='';$('picked').textContent='未選択';$('query').value='';$('results').textContent='課題開始後、検索してください。';$('aiLinks').textContent='';for(const n of ['relevance','clarity','relationRating'])$(n).value='';$('comment').value='';$('search').disabled=false;$('finish').disabled=false;$('task').disabled=true;$('pid').disabled=true;$('order').disabled=true;setStatus('計測中（時間制限なし）')}
function showLink(container,lk,items){let box=document.createElement('div');box.className='link';let p=items.get(lk.parent),c=items.get(lk.child);let h=document.createElement('div');h.textContent=`${p?.title||'元メモ'} → ${c?.title||'新メモ'}：${label[lk.relation]}（信頼度 ${lk.confidence}）`;box.append(h);let desc=document.createElement('small');desc.textContent=lk.reason;box.append(desc);container.append(box)}
async function runSearch(){if(startMs===null)return;let q=$('query').value.trim();if(!q){alert('検索文を入力してください');return}$('search').disabled=true;$('busy').textContent='検索中…';searches++;
try{let response=await fetch('/api/integrated-search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:q,top_k:10,threshold:30,as_of:null})});let data=await response.json();if(!response.ok)throw Error(data.error||data.message||`HTTP ${response.status}`);if(!Array.isArray(data.results))throw Error('検索結果の形式が不正');lastHits=data.results;lastQuery=q;selected=null;$('picked').textContent='未選択';renderHits();}catch(err){$('results').textContent='検索できませんでした: '+err.message;$('aiLinks').textContent='';}finally{$('search').disabled=false;$('busy').textContent=''}}
function renderHits(){let area=$('results');area.replaceChildren();let ai=$('aiLinks');ai.replaceChildren();if(!lastHits.length){area.textContent='該当するメモがありません';return}let map=new Map(lastHits.map(x=>[String(x.id),x]));
lastHits.forEach((hit,i)=>{let el=document.createElement('div');el.className='hit';let title=document.createElement('h3');title.textContent=`${i+1}位　${hit.title||'(無題)'}`;el.append(title);let info=document.createElement('div');info.className='meta';info.textContent=`日付 ${hit.date||'-'}・検索スコア ${hit.score??'-'}`;el.append(info);let content=document.createElement('p');content.textContent=hit.content||'';el.append(content);let b=document.createElement('button');b.className='secondary';b.textContent='このメモを回答として選択';b.onclick=()=>{selected={id:String(hit.id),title:hit.title,rank:i+1};$('picked').textContent=`${selected.title}（${selected.rank}位）`;};el.append(b);area.append(el)});
if(cond==='B'){let shown=0;for(let lk of DATA.links){if(map.has(String(lk.parent))||map.has(String(lk.child))){showLink(ai,lk,map);shown++}}if(!shown)ai.textContent='この検索結果に結びつくAI推定関係はありません。'}}}
function finish(){if(startMs===null)return;if(!selected&&!confirm('回答メモが未選択です。このまま記録しますか？'))return;let elapsed=Math.round((performance.now()-startMs)/1000);let r={participant:$('pid').value.trim(),order:$('order').value,condition:cond,task:$('task').value,query:lastQuery,selected_id:selected?.id||'',selected_title:selected?.title||'',rank:selected?.rank||'',seconds:elapsed,searches,relevance:$('relevance').value,clarity:$('clarity').value,ai_helpfulness:cond==='B'?$('relationRating').value:'',comment:$('comment').value,model:DATA.meta.model,corpus_sha256:DATA.meta.corpus_sha256,checkpoint_sha256:DATA.meta.checkpoint_sha256,recorded_at:new Date().toISOString()};rows.push(r);startMs=null;$('search').disabled=true;$('finish').disabled=true;$('task').disabled=false;setStatus(`記録済み ${rows.length}件。CSV保存を押してください。`);$('counter').textContent=`このページで記録した課題: ${rows.length}件`}
function csvEscape(s){let x=String(s??'');return '"'+x.replace(/"/g,'""')+'"'}
function exportCSV(){if(!rows.length){alert('記録がありません');return}let cols=Object.keys(rows[0]);let csv='\uFEFF'+cols.join(',')+'\r\n'+rows.map(r=>cols.map(k=>csvEscape(r[k])).join(',')).join('\r\n');let link=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.href=url;link.download=`gemma4_study_${rows[0].participant}_${cond}_${new Date().toISOString().slice(0,10)}.csv`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('order').onchange=tasksUpdate;$('task').onchange=questionUpdate;$('start').onclick=begin;$('search').onclick=runSearch;$('finish').onclick=finish;$('export').onclick=exportCSV;
window.addEventListener('beforeunload',e=>{if(startMs!==null||rows.length){e.preventDefault();e.returnValue=''}});
tasksUpdate();
})();
</script></body></html>
